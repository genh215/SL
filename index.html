<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ぎょろぎょろ蒸気機関車</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#82c9ef;font-family:system-ui,sans-serif}
.scene{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#86d3fb 0 67%,#8bc46b 67% 100%);
}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.88}
.c1{width:150px;height:42px;left:5%;top:10%}
.c2{width:105px;height:34px;right:8%;top:17%}
.engine{position:relative;width:min(92vw,620px);aspect-ratio:1/1}
.body{
  position:absolute;left:5%;right:5%;top:24%;bottom:2%;
  border-radius:24% 24% 15% 15%;background:#177bc1;border:8px solid #173949;
  box-shadow:inset 0 -24px #0b5d98;
}
.chimney{
  position:absolute;z-index:1;left:39%;top:0;width:22%;height:30%;
  background:#22292d;border:7px solid #111;border-radius:12px
}
.chimney:before{
  content:"";position:absolute;left:-25%;top:-8%;width:150%;height:22%;
  background:#22292d;border:7px solid #111;border-radius:50%
}
.face{
  position:absolute;z-index:3;left:10%;top:20%;width:80%;aspect-ratio:1;
  border-radius:50%;border:10px solid #31383c;
  background:radial-gradient(circle at 40% 28%,#fafafa 0 12%,#dedede 34%,#b7b7b7 69%,#888 100%);
  box-shadow:0 9px 0 #102c3b, inset -10px -13px 20px #888;
}
.brow{
  position:absolute;z-index:5;top:23%;width:25%;height:9%;
  border-top:9px solid #555;border-radius:50%
}
.brow.l{left:17%;transform:rotate(7deg)}
.brow.r{right:17%;transform:rotate(-7deg)}
.eye{
  position:absolute;z-index:4;top:29%;width:29%;height:34%;
  background:#fff;border:4px solid #666;border-radius:50%;overflow:hidden;
  box-shadow:inset 0 2px 7px #aaa
}
.eye.l{left:17%}.eye.r{right:17%}
.iris{
  position:absolute;left:50%;top:50%;width:57%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#555 0 7%,#171717 10% 68%,#000 69%);
  transform:translate(-50%,-50%);will-change:transform
}
.iris:after{
  content:"";position:absolute;left:22%;top:18%;width:22%;height:22%;
  background:white;border-radius:50%
}
.nose{
  position:absolute;left:42%;top:55%;width:16%;height:14%;border-radius:50%;
  background:#aaa;box-shadow:inset 5px 4px 5px #ddd,-2px 3px 3px #777
}
.cheek{position:absolute;top:61%;width:16%;height:10%;border-radius:50%;background:#aaa5}
.cheek.l{left:18%}.cheek.r{right:18%}
.mouth{
  position:absolute;left:28%;top:72%;width:44%;height:14%;
  border-bottom:8px solid #555;border-radius:0 0 50% 50%
}
.buffer{
  position:absolute;z-index:2;bottom:0;width:21%;height:10%;
  background:#333;border:5px solid #111;border-radius:13px
}
.buffer.l{left:0}.buffer.r{right:0}
.badge{
  position:absolute;z-index:6;right:5%;bottom:14%;width:17%;aspect-ratio:1;
  display:grid;place-items:center;background:#f1c638;border:5px solid #222;
  border-radius:10px;font-weight:900;font-size:clamp(28px,7vw,55px);color:#222
}
.hint{
  position:fixed;z-index:20;left:50%;bottom:16px;transform:translateX(-50%);
  white-space:nowrap;background:#ffffffd9;padding:8px 14px;border-radius:999px;
  color:#253943;font-size:13px;pointer-events:none;transition:opacity .5s
}
</style>
</head>
<body>
<div class="scene">
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="engine">
    <div class="chimney"></div><div class="body"></div>
    <div class="face">
      <div class="brow l"></div><div class="brow r"></div>
      <div class="eye l"><div class="iris"></div></div>
      <div class="eye r"><div class="iris"></div></div>
      <div class="nose"></div><div class="cheek l"></div><div class="cheek r"></div>
      <div class="mouth"></div>
    </div>
    <div class="buffer l"></div><div class="buffer r"></div><div class="badge">1</div>
  </div>
</div>
<div class="hint">画面を指でなぞってみる</div>
<script>
const eyes=[...document.querySelectorAll(".eye")];
const hint=document.querySelector(".hint");
let target={x:innerWidth/2,y:innerHeight/2};
let cur={...target}, lastInput=Date.now(), snap=0;

function aim(x,y,fast=false){
  target.x=x; target.y=y; lastInput=Date.now();
  if(fast){cur.x=x;cur.y=y;snap=4}
  hint.style.opacity="0";
}
addEventListener("pointermove",e=>aim(e.clientX,e.clientY));
addEventListener("pointerdown",e=>aim(e.clientX,e.clientY,true));
addEventListener("touchmove",e=>{
  const t=e.touches[0]; if(t) aim(t.clientX,t.clientY,true);
},{passive:true});

function draw(){
  const k=snap>0 ? .65 : .22; snap=Math.max(0,snap-1);
  cur.x+=(target.x-cur.x)*k; cur.y+=(target.y-cur.y)*k;
  eyes.forEach(eye=>{
    const p=eye.querySelector(".iris"), r=eye.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=cur.x-cx,dy=cur.y-cy,a=Math.atan2(dy,dx);
    const maxX=r.width*.245,maxY=r.height*.22;
    const strength=Math.min(1,Math.hypot(dx,dy)/180);
    const x=Math.cos(a)*maxX*strength,y=Math.sin(a)*maxY*strength;
    p.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
  });
  requestAnimationFrame(draw);
}
draw();

function randomGoggle(){
  if(Date.now()-lastInput>1200){
    const f=document.querySelector(".face").getBoundingClientRect();
    const choices=[
      [0.05,.42],[.95,.42],[.50,.08],[.50,.88],
      [.12,.15],[.88,.16],[.13,.82],[.87,.82]
    ];
    const q=choices[Math.floor(Math.random()*choices.length)];
    target.x=f.left+f.width*q[0];target.y=f.top+f.height*q[1];
    setTimeout(()=>{
      if(Date.now()-lastInput>1200){
        target.x=f.left+f.width*(.15+Math.random()*.7);
        target.y=f.top+f.height*(.12+Math.random()*.72);
      }
    },120+Math.random()*180);
  }
  setTimeout(randomGoggle,450+Math.random()*800);
}
setTimeout(randomGoggle,1300);
</script>
</body>
</html>
