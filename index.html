<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no">
<title>Steam Locomotive</title>
<style>
*{box-sizing:border-box;touch-action:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0;max-width:100vw;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:#82c9ef;font-family:system-ui,sans-serif}
.scene{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(#86d3fb 0 48%,#8bc46b 48% 100%);
}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.88}
.c1{width:150px;height:42px;left:5%;top:10%}
.c2{width:105px;height:34px;right:8%;top:17%}
.c3{width:86px;height:26px;left:3%;top:30%}
.c4{width:90px;height:28px;right:2%;top:37%}
.track{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.engine{z-index:1;isolation:isolate;position:relative;width:min(88vw,58vh,460px);width:min(88vw,58dvh,460px);aspect-ratio:4/5;margin-bottom:0}
.body{
  position:absolute;z-index:2;left:12%;right:12%;top:14%;bottom:22%;
  border-radius:24% 24% 15% 15%;background:var(--body-color,#177bc1);border:8px solid #173949;
  box-shadow:inset 0 -24px var(--body-shade,#0b5d98);
}
.chimney{
  position:absolute;z-index:2;left:41%;top:0;width:18%;height:23%;
  background:transparent;border:7px solid transparent;border-radius:12px
}
.chimney:before{
  content:"";position:absolute;z-index:1;left:50%;top:-8%;width:150%;height:22%;
  transform:translateX(-50%);
  background:#22292d;border:7px solid #111;border-radius:50%
}
.chimney:after{
  content:"";position:absolute;z-index:0;left:-7px;right:-7px;top:8%;bottom:-7px;
  background:#22292d;border:7px solid #111;border-radius:12px
}
.face{
  position:absolute;z-index:6;left:19%;top:18%;width:62%;aspect-ratio:1;
  border-radius:50%;border:10px solid #31383c;
  background:radial-gradient(circle at 40% 28%,#fafafa 0 12%,#dedede 34%,#b7b7b7 69%,#888 100%);
  box-shadow:0 9px 0 #102c3b, inset -10px -13px 20px #888;
}
.brow{
  position:absolute;z-index:5;top:23%;width:25%;height:9%;
  border-top:9px solid #555;border-radius:50%
}
.brow.l{left:17%;transform:rotate(7deg)}
.brow.r{right:17%;transform:rotate(-7deg)}
.eye{
  position:absolute;z-index:4;top:29%;width:29%;height:34%;
  background:#fff;border:4px solid #666;border-radius:50%;overflow:hidden;
  box-shadow:inset 0 2px 7px #aaa
}
.eye.l{left:17%}.eye.r{right:17%}
.iris{
  position:absolute;left:50%;top:50%;width:57%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 35% 32%,#555 0 7%,#171717 10% 68%,#000 69%);
  transform:translate(-50%,-50%);will-change:transform
}
.iris:after{
  content:"";position:absolute;left:22%;top:18%;width:22%;height:22%;
  background:white;border-radius:50%
}
.nose{
  position:absolute;left:42%;top:55%;width:16%;height:14%;border-radius:50%;
  background:#aaa;box-shadow:inset 5px 4px 5px #ddd,-2px 3px 3px #777
}
.cheek{position:absolute;top:61%;width:16%;height:10%;border-radius:50%;background:#aaa5}
.cheek.l{left:18%}.cheek.r{right:18%}
.mouth{
  position:absolute;left:28%;top:72%;width:44%;height:14%;
  border-bottom:8px solid #555;border-radius:0 0 50% 50%
}
.chassis{
  position:absolute;z-index:4;left:3%;right:3%;bottom:9%;height:13%;
  background:#d22b2b;border:5px solid #561818;border-radius:6px
}
.wheel{
  position:absolute;z-index:1;bottom:-8%;width:8%;height:30%;
  background:#24282b;border:4px solid #111;border-radius:18%;
  box-shadow:inset 0 0 0 2px #555
}
.wheel.w1{left:16%}.wheel.w2{display:none}.wheel.w3{right:16%}
.wheel:before{content:"";position:absolute;inset:-24px}
.wheel:after{display:none}
.buffer{
  position:absolute;z-index:5;bottom:9%;width:18%;aspect-ratio:1;
  background:radial-gradient(circle at 35% 30%,#41484c,#24282b 70%);border:4px solid #111;border-radius:50%
}
.buffer.l{left:1%}.buffer.r{right:1%}

.smoke{position:absolute;inset:0;z-index:3;pointer-events:none}
.smoke-puff{
  position:absolute;left:50%;top:-1%;width:16%;aspect-ratio:1;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#f1f1f1,#9da4aa);
  opacity:0;transform:translate(-50%,-50%) scale(.35);
  animation:smoke-rise var(--duration) ease-out var(--delay) both;
}
@keyframes smoke-rise{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}
  12%{opacity:.8}
  100%{opacity:0;transform:translate(calc(-50% + var(--drift)),calc(-50% + var(--rise))) scale(2.5)}
}
</style>
</head>
<body>
<div class="scene">
  <svg class="track" aria-hidden="true"></svg>
  <div class="cloud c1" role="button" tabindex="0" aria-label="Change locomotive color"></div>
  <div class="cloud c2" role="button" tabindex="0" aria-label="Change locomotive color"></div>
  <div class="cloud c3" role="button" tabindex="0" aria-label="Change locomotive color"></div>
  <div class="cloud c4" role="button" tabindex="0" aria-label="Change locomotive color"></div>
  <div class="engine">
    <div class="smoke" aria-hidden="true"></div>
    <div class="chimney" role="button" tabindex="0" aria-label="煙を出す"></div><div class="body"></div>
    <div class="face">
      <div class="brow l"></div><div class="brow r"></div>
      <div class="eye l"><div class="iris"></div></div>
      <div class="eye r"><div class="iris"></div></div>
      <div class="nose"></div><div class="cheek l"></div><div class="cheek r"></div>
      <div class="mouth"></div>
    </div>
    <div class="wheel w1" role="button" tabindex="0" aria-label="Start or stop locomotive" aria-pressed="false"></div><div class="wheel w2"></div><div class="wheel w3" role="button" tabindex="0" aria-label="Start or stop locomotive" aria-pressed="false"></div>
    <div class="chassis"></div>
    <div class="buffer l"></div><div class="buffer r"></div>
  </div>
</div>
<script>
const eyes=[...document.querySelectorAll(".eye")];
let target={x:innerWidth/2,y:innerHeight/2};
let cur={...target}, lastInput=Date.now(), snap=0;

function aim(x,y,fast=false){
  target.x=x; target.y=y; lastInput=Date.now();
  if(fast){cur.x=x;cur.y=y;snap=4}
}
addEventListener("pointermove",e=>aim(e.clientX,e.clientY));
addEventListener("pointerdown",e=>aim(e.clientX,e.clientY,true));
addEventListener("touchmove",e=>{
  const t=e.touches[0]; if(t) aim(t.clientX,t.clientY,true);
},{passive:true});

function draw(){
  const k=snap>0 ? .65 : .22; snap=Math.max(0,snap-1);
  cur.x+=(target.x-cur.x)*k; cur.y+=(target.y-cur.y)*k;
  eyes.forEach(eye=>{
    const p=eye.querySelector(".iris"), r=eye.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    const dx=cur.x-cx,dy=cur.y-cy,a=Math.atan2(dy,dx);
    const maxX=r.width*.245,maxY=r.height*.22;
    const strength=Math.min(1,Math.hypot(dx,dy)/180);
    const x=Math.cos(a)*maxX*strength,y=Math.sin(a)*maxY*strength;
    p.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
  });
  requestAnimationFrame(draw);
}
draw();

function randomGoggle(){
  if(Date.now()-lastInput>2500){
    const f=document.querySelector(".face").getBoundingClientRect();
    const choices=[
      [0.05,.42],[.95,.42],[.50,.08],[.50,.88],
      [.12,.15],[.88,.16],[.13,.82],[.87,.82]
    ];
    const q=choices[Math.floor(Math.random()*choices.length)];
    target.x=f.left+f.width*q[0];target.y=f.top+f.height*q[1];
    setTimeout(()=>{
      if(Date.now()-lastInput>2500){
        target.x=f.left+f.width*(.15+Math.random()*.7);
        target.y=f.top+f.height*(.12+Math.random()*.72);
      }
    },120+Math.random()*180);
  }
  setTimeout(randomGoggle,1800+Math.random()*1400);
}
setTimeout(randomGoggle,2600);
</script>

<script>
const track=document.querySelector('.track');
const scene=document.querySelector('.scene');
const engine=document.querySelector('.engine');
let running=false,sleeperPhase=0,runFrame=0,lastRunTime=null;
let renderSleepers=()=>{};
const wheels=[...document.querySelectorAll('.wheel.w1,.wheel.w3')];
function runTrack(time){
  if(!running) return;
  if(lastRunTime!==null){sleeperPhase=(sleeperPhase+Math.min(time-lastRunTime,100)*.0015)%1;}
  lastRunTime=time;
  renderSleepers();
  runFrame=requestAnimationFrame(runTrack);
}
function toggleRunning(){
  running=!running;
  wheels.forEach(wheel=>wheel.setAttribute('aria-pressed',String(running)));
  if(running){lastRunTime=null;runFrame=requestAnimationFrame(runTrack);}
  else{cancelAnimationFrame(runFrame);lastRunTime=null;}
}
for(const wheel of wheels){
  wheel.addEventListener('click',()=>{if(Date.now()>=touchClickBlockedUntil) toggleRunning()});
  wheel.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!event.repeat) toggleRunning()}
  });
}

function drawTrack(){
  const frame=scene.getBoundingClientRect();
  const left=document.querySelector('.wheel.w1').getBoundingClientRect();
  const right=document.querySelector('.wheel.w3').getBoundingClientRect();
  const width=frame.width,height=frame.height;
  const vanishX=width/2,horizon=height*.48;
  const contactY=left.bottom-frame.top;
  const contactLeft=left.left+left.width/2-frame.left;
  const contactRight=right.left+right.width/2-frame.left;
  const depth=height-horizon;
  const project=(x,y)=>vanishX+(x-vanishX)*(y-horizon)/(contactY-horizon);
  const railWidth=left.width*.32;
  track.setAttribute('viewBox',`0 0 ${width} ${height}`);
  track.replaceChildren();
  function polygon(points,fill,parent=track){
    const shape=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    shape.setAttribute('points',points.map(p=>p.join(',')).join(' '));
    shape.setAttribute('fill',fill);
    parent.append(shape);
  }
  const outerLeft=vanishX+(contactLeft-vanishX)*1.6;
  const outerRight=vanishX+(contactRight-vanishX)*1.6;
  polygon([[vanishX,horizon],[project(outerRight,height),height],
    [project(outerLeft,height),height]],'#a7a18b');
  const sleepers=document.createElementNS('http://www.w3.org/2000/svg','g');
  track.append(sleepers);
  renderSleepers=()=>{
    sleepers.replaceChildren();
    for(let i=30;i>=0;i--){
      const scale=Math.pow(.82,i+sleeperPhase),y=horizon+depth*scale;
      const thickness=Math.max(.5,12*scale*scale);
      const x1=vanishX+(contactLeft-vanishX)*1.4;
      const x2=vanishX+(contactRight-vanishX)*1.4;
      polygon([[project(x1,y-thickness),y-thickness],
        [project(x2,y-thickness),y-thickness],[project(x2,y),y],
        [project(x1,y),y]],'#655044',sleepers);
    }
  };
  renderSleepers();
  for(const x of [contactLeft,contactRight]){
    polygon([[vanishX,horizon],[project(x+railWidth/2,height),height],
      [project(x-railWidth/2,height),height]],'#4b5358');
    polygon([[vanishX,horizon],[project(x+railWidth*.18,height),height],
      [project(x-railWidth*.18,height),height]],'#c7d0d4');
  }
}
new ResizeObserver(drawTrack).observe(scene);
new ResizeObserver(drawTrack).observe(engine);
drawTrack();
</script>

<script>
const chimney=document.querySelector('.chimney');
const smoke=document.querySelector('.smoke');
let smokeTimer;
let touchClickBlockedUntil=0;
function emitSmoke(){
  clearTimeout(smokeTimer);
  smoke.replaceChildren();
  const size=document.querySelector('.engine').getBoundingClientRect().width;
  for(let i=0;i<7;i++){
    const puff=document.createElement('span');
    puff.className='smoke-puff';
    const delay=i*85;
    puff.style.setProperty('--delay',`${delay}ms`);
    puff.style.setProperty('--duration',`${1000-delay}ms`);
    puff.style.setProperty('--rise',`${-size*(.4+i*.028)}px`);
    puff.style.setProperty('--drift',`${size*(i%2 ? -.045 : .045)}px`);
    smoke.append(puff);
  }
  smokeTimer=setTimeout(()=>smoke.replaceChildren(),1000);
}
chimney.addEventListener('click',()=>{
  if(Date.now()>=touchClickBlockedUntil) emitSmoke();
});
chimney.addEventListener('keydown',event=>{
  if(event.key==='Enter'||event.key===' '){
    event.preventDefault();
    if(!event.repeat) emitSmoke();
  }
});
</script>

<script>
const bodyPanel=document.querySelector('.body');
const bodyColors=[['#177bc1','#0b5d98'],['#8dcc38','#589624'],['#d63d35','#a72625']];
let bodyColorIndex=0;
function cycleBodyColor(){
  bodyColorIndex=(bodyColorIndex+1)%bodyColors.length;
  const [color,shade]=bodyColors[bodyColorIndex];
  bodyPanel.style.setProperty('--body-color',color);
  bodyPanel.style.setProperty('--body-shade',shade);
}
for(const cloud of document.querySelectorAll('.cloud')){
  cloud.addEventListener('click',()=>{if(Date.now()>=touchClickBlockedUntil) cycleBodyColor()});
  cloud.addEventListener('keydown',event=>{
    if(event.key==='Enter'||event.key===' '){event.preventDefault();if(!event.repeat) cycleBodyColor()}
  });
}
</script>

<script>
// Cancel browser zoom gestures while preserving the scene's touch interactions.
const touchOptions={passive:false,capture:true};
const preventZoom=event=>{if(event.cancelable) event.preventDefault()};
for(const type of ['gesturestart','gesturechange','gestureend']){
  document.addEventListener(type,preventZoom,touchOptions);
}
let sceneTouch=null;
document.addEventListener('touchstart',event=>{
  preventZoom(event);
  if(event.touches.length!==1){sceneTouch=null;return}
  const touch=event.touches[0];
  sceneTouch={id:touch.identifier,x:touch.clientX,y:touch.clientY,
    chimney:event.target instanceof Element && !!event.target.closest('.chimney'),
    wheel:event.target instanceof Element && !!event.target.closest('.wheel'),
    cloud:event.target instanceof Element && !!event.target.closest('.cloud'),moved:false};
  aim(touch.clientX,touch.clientY,true);
},touchOptions);
document.addEventListener('touchmove',event=>{
  preventZoom(event);
  if(event.touches.length!==1){sceneTouch=null;return}
  const touch=event.touches[0];
  if(sceneTouch && Math.hypot(touch.clientX-sceneTouch.x,touch.clientY-sceneTouch.y)>12){
    sceneTouch.moved=true;
  }
},touchOptions);
document.addEventListener('touchend',event=>{
  preventZoom(event);
  touchClickBlockedUntil=Date.now()+700;
  const touch=sceneTouch && [...event.changedTouches].find(t=>t.identifier===sceneTouch.id);
  if(touch && !event.touches.length && !sceneTouch.moved &&
    Math.hypot(touch.clientX-sceneTouch.x,touch.clientY-sceneTouch.y)<=12){
    if(sceneTouch.chimney) emitSmoke();
    else if(sceneTouch.wheel) toggleRunning();
    else if(sceneTouch.cloud) cycleBodyColor();
  }
  sceneTouch=null;
},touchOptions);
document.addEventListener('touchcancel',event=>{
  preventZoom(event);
  sceneTouch=null;
},touchOptions);
</script>
</body>
</html>
